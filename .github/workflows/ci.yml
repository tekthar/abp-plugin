# Pushes to main and pull requests run the checks: the version has its changelog entry (scripts/check-release.sh), no
# old product name (scripts/check-names.sh), build, the unit tests, the integration tests against PostgreSQL through the
# sample host, pack, and no old product name in the packages either; the browser package's and the samples' web parts
# are type-checked, tested and built. A v<version> tag runs the checks, then pushes the
# packages (AbpPlugin, AbpPlugin.Web, AbpPlugin.Sdk, AbpPlugin.Packaging, AbpPlugin.Build, AbpPlugin.Sign) to nuget.org through Trusted
# Publishing (a one-hour key nuget.org gives this workflow, no stored secret) and makes a GitHub release.

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ABP_PLUGIN_TEST_POSTGRES: "Host=localhost;Port=5432;Username=postgres;Password=postgres"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - run: bash scripts/check-release.sh
      - run: bash scripts/check-names.sh
      - run: dotnet build AbpPlugin.slnx -c Release
      - run: dotnet test AbpPlugin.slnx -c Release --no-build
      - run: dotnet pack AbpPlugin.slnx -c Release --no-build -o artifacts
      - run: bash scripts/check-names.sh --packages artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: artifacts/

  web:
    # The browser package (packages/plugin-web) and the samples' web parts: types, tests, builds.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The browser package
        working-directory: packages/plugin-web
        run: npm ci && npm run typecheck && npm test && npm pack --dry-run
      - name: The sample plugin's web part
        working-directory: samples/AbpPlugin.Sample/web
        run: npm ci && npx tsc --noEmit && npm run build
      - name: The sample host's page
        working-directory: samples/AbpPlugin.SampleHost/web
        run: npm ci && npx tsc --noEmit && npm run build

  publish:
    needs: [check, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    # The nuget.org Trusted Publishing policy names this repository, ci.yml and this environment.
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      # The checkout first: it empties the workspace, so the packages come after it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/
      - run: bash scripts/check-release.sh --tag "$GITHUB_REF_NAME" --unpublished
      - name: The tag is the packages' version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for id in AbpPlugin AbpPlugin.Web AbpPlugin.Sdk AbpPlugin.Packaging AbpPlugin.Build AbpPlugin.Sign; do
            test -f "artifacts/$id.$version.nupkg" || { echo "No $id.$version.nupkg: the tag and VersionPrefix/VersionSuffix differ."; ls artifacts; exit 1; }
          done
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"
      - name: nuget.org key for this run
        id: nuget
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ vars.NUGET_USER }}
      - name: Push to nuget.org
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md." $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
